function body(s,k,visual=k){
 if(s.kind==='cover')return `<div class="latex-cover">${brand?`<img src="${brand}" alt="Emory University · Oxford College" class="institutional-header">`:'<p class="public-institution">Oxford College of Emory University</p>'}<h1 class="cover-title">${esc(s.title)}</h1><div class="short-gold-rule"></div><p class="subtitle">${esc(s.subtitle)}</p><p class="cover-course">ECON_OX 112 · Principles of Macroeconomics</p><p class="cover-author">Guilherme Paiva Pinto</p></div>`;

 if(s.kind==='indicators')return cues(s.items,k)+`<p class="formula">${esc(s.formula)}</p><p class="formula-legend">${esc(s.formula_legend)}</p>`+reveal('<p class="example-line">'+esc(s.example)+'</p>',3,k)+`<p class="takeaway">${esc(s.takeaway)}</p>`;
 if(s.kind==='taylor')return `<p class="formula">${esc(s.formula)}</p>${table(s.input_table,'inputs')}<div class="rate-directions">${s.items.map(([h,t])=>'<p><strong>'+esc(h)+':</strong> '+esc(t)+'</p>').join('')}</div>`+reveal('<p class="activity-prompt">'+esc(s.activity_prompt)+'</p>',2,k)+reveal('<p class="result">'+esc(s.activity_answer)+'</p>',3,k)+`<p class="takeaway">${esc(s.takeaway)}</p>`;
 if(s.kind==='comparison')return table(s.table,'comparison-table')+reveal('<p class="takeaway">'+esc(s.takeaway)+'</p>',2,k);
 if(s.kind==='neutrality')return cues(s.items,k)+reveal(table(s.example_table,'neutral-example'),3,k)+`<p class="takeaway">${esc(s.takeaway)}</p>`;
 if(s.kind==='checkpoint')return `<p class="facts">${esc(s.facts)}</p><p class="activity-prompt">${esc(s.activity_prompt)}</p>`+reveal(table(s.answer_table,'checkpoint-answer')+'<p class="answer-reason">'+esc(s.answer_reason)+'</p>',2,k,'answer');

}
function fullSlide(s,k,i){const credit=s.sources.map(key=>`<a href="${esc(sources[key][1])}">${esc(sources[key][0])}</a>`).join(' · ');return `<section class="slide ${s.id} ${s.kind}${s.kind==='cover'?' title-slide':''}" data-id="${s.id}" data-stage="${k}"><div class="monetary-slide"><div class="${s.kind==='cover'?'':'content-title'}">${s.kind==='cover'?'':'<h1>'+esc(s.title)+'</h1>'}</div><div class="slide-body${s.kind==='cover'?' cover-body':''}">${body(s,k)}</div><div class="sources">${credit}</div></div><footer><span>ECON_OX 112 · Chapter 15 · Monetary Policy</span><span>${i+1} / ${slides.length} · ${k} / ${s.stages}</span></footer></section>`}
let current=0,stage=1,visual=1,frame;
function scale(){const v=document.getElementById('viewport'),s=v.querySelector('.slide'),z=Math.min(innerWidth/1200,(innerHeight-56)/675);s.style.transform='scale('+z+')';v.style.width=1200*z+'px';v.style.height=675*z+'px'}
function render(){const entry=slides[current],old=document.querySelector('.slide'),from=old?.dataset.id===entry.id?visual:stage;cancelAnimationFrame(frame);visual=stage;document.getElementById('viewport').innerHTML=fullSlide(entry,stage,current);document.getElementById('position').textContent=(current+1)+' / '+slides.length+' · Step '+stage+' / '+entry.stages;document.getElementById('jump').value=current;document.getElementById('back').disabled=current===0&&stage===1;document.getElementById('next').disabled=current===slides.length-1&&stage===entry.stages;document.getElementById('restart').disabled=stage===1;history.replaceState(null,'','#'+(current+1)+'/'+stage);scale();
if(entry.graph&&from!==stage){const slot=document.querySelector('.plot-slot'),start=performance.now(),end=stage,duration=matchMedia('(prefers-reduced-motion:reduce)').matches?0:850;slot.dataset.ready='false';function draw(now){const p=duration?Math.min(1,(now-start)/duration):1,e=p*p*(3-2*p);visual=from+(end-from)*e;slot.innerHTML=moneyGraph(entry.graph,visual);if(p<1)frame=requestAnimationFrame(draw);else slot.dataset.ready='true'}frame=requestAnimationFrame(draw)}}
function go(i,k=1){current=Math.max(0,Math.min(slides.length-1,i));stage=Math.max(1,Math.min(slides[current].stages,k));render()}
function next(){if(stage<slides[current].stages)stage++;else if(current<slides.length-1){current++;stage=1}render()}
function back(){if(stage>1)stage--;else if(current>0){current--;stage=slides[current].stages}render()}
function restart(){stage=1;render()}
document.getElementById('next').onclick=next;document.getElementById('back').onclick=back;document.getElementById('restart').onclick=restart;document.getElementById('jump').onchange=e=>go(+e.target.value,1);
addEventListener('resize',scale);addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT|A)$/.test(e.target.tagName)||(e.target.tagName==='BUTTON'&&[' ','Enter'].includes(e.key)))return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();back()}else if(e.key.toLowerCase()==='r')restart()});const h=location.hash.slice(1).split('/').map(Number);go((h[0]||1)-1,h[1]||1);window.courseDeck={go,next,back,restart,slides,getState:()=>({current,stage})};</script></body></html>
