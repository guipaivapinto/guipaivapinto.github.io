tion value=\"2\">3. Inflation and the Output Gap\u003c/option>\u003coption value=\"3\">4. The Taylor Rule\u003c/option>\u003coption value=\"4\">5. The Zero Lower Bound\u003c/option>\u003coption value=\"5\">6. Quantitative Easing\u003c/option>\u003coption value=\"6\">7. Short- and Long-Run Effects\u003c/option>\u003coption value=\"7\">8. Monetary Neutrality\u003c/option>\u003coption value=\"8\">9. Monetary Expansion\u003c/option>\u003coption value=\"9\">10. Monetary Contraction\u003c/option>\u003coption value=\"10\">11. Long-Run Checkpoint\u003c/option>\u003c/select>\u003ca href=\"./\">Chapter 15\u003c/a>\u003c/nav>\u003cscript>const slides=[{\"id\":\"cover2\",\"title\":\"Chapter 15: Monetary Policy\",\"subtitle\":\"Part 2: Policy in Practice\",\"kind\":\"cover\",\"stages\":1,\"points\":[],\"sources\":[]},{\"id\":\"roadmap2\",\"title\":\"Roadmap\",\"kind\":\"roadmap\",\"stages\":1,\"points\":[\"Choose a policy rate.\",\"Explain the lower bound and QE.\",\"Compare short- and long-run effects.\"],\"sources\":[]},{\"id\":\"practiceoverview\",\"title\":\"Inflation and the Output Gap\",\"kind\":\"indicators\",\"stages\":3,\"points\":[\"A goal for inflation over time.\",\"Real GDP relative to potential GDP.\",\"Y = 980; Y* = 1,000 → g = −2%\"],\"items\":[[\"Inflation target\",\"A goal for inflation over time.\"],[\"Output gap\",\"Real GDP relative to potential GDP.\"]],\"sources\":[\"inflationgoal\",\"rules\"],\"formula\":\"g = 100 × (Y − Y*) / Y*\",\"formula_legend\":\"Y: real GDP · Y*: potential GDP · g: output gap (%)\",\"example\":\"Y = 980; Y* = 1,000 → g = −2%\",\"takeaway\":\"Fed inflation goal: 2% PCE.\"},{\"id\":\"taylor\",\"title\":\"The Taylor Rule\",\"kind\":\"taylor\",\"stages\":3,\"points\":[\"Inflation above target raises the suggested rate.\",\"Output below potential lowers the suggested rate.\"],\"items\":[[\"Inflation above target\",\"Raises the suggested rate.\"],[\"Output below potential\",\"Lowers the suggested rate.\"]],\"sources\":[\"rules\"],\"formula\":\"i = r* + π + 0.5(π − π*) + 0.5g\",\"takeaway\":\"i is a nominal policy-rate benchmark.\",\"input_table\":[[\"r*: neutral real rate\",\"π: inflation\",\"π*: target\",\"g: output gap\"],[\"2%\",\"4%\",\"2%\",\"−2%\"]],\"activity_prompt\":\"Calculate i. Compare your reasoning with a partner.\",\"activity_answer\":\"i = 2 + 4 + 1 − 1 = 6%\"},{\"id\":\"zerobound\",\"title\":\"The Zero Lower Bound\",\"kind\":\"labels\",\"stages\":3,\"points\":[\"Nominal rates cannot fall far below zero.\",\"People can hold cash instead.\",\"QE targets longer-term borrowing costs.\"],\"items\":[[\"Limit\",\"Nominal rates cannot fall far below zero.\"],[\"Reason\",\"People can hold cash instead.\"],[\"Next tool\",\"QE targets longer-term borrowing costs.\"]],\"sources\":[\"lowerbound\"],\"takeaway\":\"Some central banks have used slightly negative rates.\"},{\"id\":\"qe\",\"title\":\"Quantitative Easing\",\"kind\":\"labels\",\"stages\":3,\"points\":[\"The central bank buys large amounts of longer-term bonds.\",\"Higher bond prices mean lower yields.\",\"Lower borrowing costs can support C and I.\"],\"items\":[[\"Action\",\"The central bank buys large amounts of longer-term bonds.\"],[\"Bond market\",\"Higher bond prices mean lower yields.\"],[\"Spending\",\"Lower borrowing costs can support C and I.\"]],\"sources\":[\"qe\"],\"takeaway\":\"More reserves do not automatically mean more lending.\"},{\"id\":\"shortlong\",\"title\":\"Short- and Long-Run Effects\",\"kind\":\"comparison\",\"stages\":2,\"points\":[],\"sources\":[\"neutralmoney\"],\"takeaway\":\"One-time money change; productive capacity fixed.\",\"table\":[[\"\",\"Short run\",\"Long run\"],[\"Wages and prices\",\"Sticky\",\"Fully adjusted\"],[\"Real output\",\"Can change\",\"At potential\"],[\"Price level\",\"Starts adjusting\",\"Reflects money supply\"]]},{\"id\":\"neutrality\",\"title\":\"Monetary Neutrality\",\"kind\":\"neutrality\",\"stages\":3,\"points\":[\"Money changes prices, not real output.\",\"Workers, capital and technology determine potential output.\"],\"items\":[[\"Long run\",\"Money changes prices, not real output.\"],[\"Real capacity\",\"Workers, capital and technology determine potential output.\"]],\"sources\":[\"neutralmoney\"],\"takeaway\":\"Full price adjustment; other long-run conditions fixed.\",\"example_table\":[[\"Money supply\",\"Price level\",\"Real output\"],[\"+10%\",\"+10%\",\"Unchanged\"]]},{\"id\":\"longrunexpand\",\"title\":\"Monetary Expansion\",\"kind\":\"graph\",\"stages\":3,\"points\":[\"MS = 600; i = 4%.\",\"MS rises to 800; i falls to 2%.\",\"Prices rise. MD shifts right; i returns to 4%.\"],\"sources\":[\"neutralmoney\"],\"takeaway\":\"New MS stays at 800; potential output is unchanged.\",\"graph\":\"long_money_expand\",\"step_titles\":[\"Start\",\"Short run\",\"Long run\"],\"condition\":\"One-time MS change; long-run expected inflation unchanged.\"},{\"id\":\"longruncontract\",\"title\":\"Monetary Contraction\",\"kind\":\"graph\",\"stages\":3,\"points\":[\"MS = 600; i = 4%.\",\"MS falls to 400; i rises to 6%.\",\"Prices fall. MD shifts left; i returns to 4%.\"],\"sources\":[\"neutralmoney\"],\"takeaway\":\"New MS stays at 400; potential output is unchanged.\",\"graph\":\"long_money_contract\",\"step_titles\":[\"Start\",\"Short run\",\"Long run\"],\"condition\":\"One-time MS change; long-run expected inflation unchanged.\"},{\"id\":\"checkpoint2\",\"title\":\"Long-Run Checkpoint\",\"kind\":\"checkpoint\",\"stages\":2,\"points\":[\"Predict output, prices, and MD. Which curve moves first?\"],\"sources\":[\"neutralmoney\"],\"activity_prompt\":\"Predict output, prices, and MD. Which curve moves first?\",\"facts\":\"MS falls 20%. Prices fully adjust; other long-run conditions stay fixed.\",\"answer_table\":[[\"Real output\",\"Price level\",\"Nominal MD\"],[\"Unchanged\",\"−20%\",\"Shifts left\"]],\"answer_reason\":\"MS moves first. Lower prices later shift MD left.\"}],sources={\"inflationgoal\":[\"Federal Reserve Board: inflation objective\",\"https   const style=document.createElement('style');style.textContent=`html,body{margin:0;background:#eef1f4;font-family:Arial,sans-serif;color:#173e5e;height:100%;overflow:hidden}#ss-player-stage{position:absolute;left:50%;top:calc(50% - 28px);transform:translate(-50%,-50%);background:white;width:1200px;height:675px;transform-origin:center center;box-shadow:0 3px 20px #173e5e18}#ss-native-frame{width:100%;height:100%;border:0}#ss-custom-stage{position:absolute;inset:0;display:none}#ss-player-controls{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;justify-content:center;align-items:center;gap:12px;background:white;border-top:1px solid #d8e0e8;padding:0 12px;box-sizing:border-box}#ss-player-controls button,#ss-player-controls select{font:14px Arial,sans-serif;padding:7px 10px;border:1px solid #ccd8e2;background:white;color:#173e5e;border-radius:5px}#ss-player-controls button{cursor:pointer}#ss-player-controls button:disabled{opacity:.4;cursor:default}#ss-position{font-size:13px;white-space:nowrap}#ss-jump{max-width:34vw}button:focus-visible,select:focus-visible{outline:3px solid #98bfda}@media(max-width:700px){#ss-player-controls{gap:5px}#ss-player-controls button{font-size:11px;padding:7px}#ss-jump{max-width:22vw}#ss-fullscreen{display:none}}`;
  document.head.append(style);window.SlideStudioLayouts.install();
  function title(entry){const e=Object.values(data.edits||{}).find(e=>e.slide===entry.id&&e.label==='Heading');return e?.value||entry.title||'New slide';}
  function rebuild(){
    const selected=entries[index]?.id,s=data.structure||{},base=new Map(cfg.slides.map(x=>[x.id,{...x}]));
    for(const e of s.added||[]){
      const source=e.layout==='copy'?base.get(e.source):null;
      base.set(e.id,{...e,title:source?.title||window.SlideStudioLayouts.definitions.find(l=>l.id===e.layout)?.name||'New slide',native:source?.native,stages:source?.stages||window.SlideStudioLayouts.stageCount(e.layout)});
    }
    const order=[...(s.order||[])];for(const id of base.keys())if(!order.includes(id))order.push(id);
    entries=[...cfg.prefix,...order.filter(id=>!s.removed?.includes(id)&&base.has(id)).map(id=>base.get(id))];
    $('#ss-jump').replaceChildren();entries.forEach((e,i)=>{const option=document.createElement('option');option.value=i;option.textContent=(i+1)+'. '+title(e);$('#ss-jump').append(option);});
    if(selected){const n=entries.findIndex(e=>e.id===selected);if(n>=0)index=n;}index=Math.max(0,Math.min(index,entries.length-1));
  }
  function scale(){const ratio=Math.min(innerWidth/1200,(innerHeight-56)/675);$('#ss-player-stage').style.transform=`translate(-50%,-50%) scale(${ratio})`;}
  function nativeEdits(entry){
    const edits={};for(const [key,e] of Object.entries(data.edits||{}))if(!e.slide.startsWith('custom-'))edits[key]=e;
    if(entry.layout==='copy')for(const [key,e] of Object.entries(data.edits||{}))if(e.slide===entry.id)edits[key]={...e,slide:entry.source};
    const styles={...data.structure?.styles};if(entry.layout==='copy'&&styles[entry.id])styles[entry.source]=styles[entry.id];
    return {...data,edits,structure:{added:[],removed:[],order:[],styles}};
  }
  function updateNative(entry){
    const win=iframe.contentWindow;if(!loaded||!entry?.native)return;
    win.CourseWriting?.apply(nativeEdits(entry));
    const target=entry.native+':'+step;
    if(target!==lastNative){lastNative=target;if(win.courseDeck)win.courseDeck.go(entry.native-1,step);else win.location.hash='/'+entry.native+(step>1?'?clicks='+(step-1):'');}
    // Native rendering may mount its slide after the route changes.
    requestAnimationFrame(()=>{win.CourseWriting?.apply(nativeEdits(entry));renumberNative(entry);});
  }
  function renumberNative(entry){
    const doc=iframe.contentDocument;if(!doc||!entry?.native)return;
    const footer=doc.querySelector('.monetary-slide')?.closest('section')?.querySelector('footer')||doc.querySelector('.p2-slide footer,.fiscal-slide footer,section.slide footer');
    if(footer){const spans=footer.querySelectorAll('span'),last=spans[spans.length-1];if(last){const text=last.textContent.replace(/^\d+\s*\/\s*\d+/,`${index+1} / ${entries.length}`);if(last.textContent!==text)last.textContent=text;}}
  }
  function render(){
    const entry=entries[index];if(!entry)return;step=Math.max(1,Math.min(step,entry.stages));
    $('#ss-position').textContent=`${index+1} / ${entries.length} · Step ${step} / ${entry.stages}`;$('#ss-jump').value=index;
    $('#ss-back').disabled=index===0&&step===1;$('#ss-next').disabled=index===entries.length-1&&step===entry.stages;$('#ss-restart').disabled=step===1;
    if(entry.native){iframe.style.display='block';stage.style.display='none';stage.replaceChildren();updateNative(entry);}
    else{
      iframe.style.display='none';stage.style.display='block';const frame=window.SlideStudioLayouts.create(entry,step);frame.querySelector('footer span:last-child').textContent=`${index+1} / ${entries.length} · ${step} / ${entry.stages}`;stage.replaceChildren(frame);writing.apply(data);
    }
    hashGuard=true;history.replaceState(null,'','#'+(index+1)+'/'+step);hashGuard=false;
    document.body.dataset.presentationReady=entry.id;document.title=title(entry)+' · Course slides';scale();
  }
  function next(){if(step<entries[index].stages)step++;else if(index<entries.length-1){index++;step=1;}render();}
  function back(){if(step>1)step--;else if(index>0){index--;step=entries[index].stages;}render();}
  function key(e){if(/^(INPUT|SELECT|TEXTAREA|A)$/.test(e.target.tagName))return;let action;if(['ArrowRight','PageDown',' '].includes(e.key))action=next;else if(['ArrowLeft','PageUp'].includes(e.key))action=back;else if(e.key.toLowerCase()==='r')action=()=>{step=1;render();};if(action){e.preventDefault();e.stopImmediatePropagation();action();}}
  $('#ss-next').onclick=next;$('#ss-back').onclick=back;$('#ss-restart').onclick=()=>{step=1;render();};$('#ss-jump').onchange=e=>{index=+e.target.value;step=1;render();};
  $('#ss-fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  addEventListener('keydown',key,true);addEventListener('resize',scale);
  function fromHash(){if(hashGuard)return;const m=location.hash.match(/^#\/?(\d+)(?:\/(\d+))?/);if(m){index=Math.max(0,Math.min(entries.length-1,+m[1]-1));step=+m[2]||1;}render();}
  addEventListener('hashchange',fromHash);
  iframe.onload=()=>{
    loaded=true;lastNative='';const doc=iframe.contentDocument,win=iframe.contentWindow;win.addEventListener('keydown',key,true);
    const css=doc.createElement('style');css.textContent='body.live>nav,.local-controls,.slidev-nav,#slidev-nav,.slidev-controls{display:none!important}body.live{align-items:center!important;justify-content:center!important}';doc.head.append(css);
    const observer=new MutationObserver(()=>requestAnimationFrame(()=>renumberNative(entries[index])));observer.observe(doc.body,{subtree:true,childList:true});
    updateNative(entries[index]);
  };
  rebuild();fromHash();iframe.src=cfg.native_url;
  if(cfg.live_url)setInterval(async()=>{try{const response=await fetch(cfg.live_url,{cache:'no-store'});if(response.ok){const fresh=await response.json();if(JSON.stringify(fresh)!==JSON.stringify(data)){data=fresh;rebuild();render();}}}catch{}},1200);
  window.SlideStudioPlayer={getState:()=>({index,step,id:entries[index]?.id,entries:entries.map(e=>({id:e.id,title:title(e),stages:e.stages}))}),next,back};
})();
</script></body></html>
