,visual=1,animationFrame=0;const slides=[{"id":"cover2","title":"Monetary Policy in Practice","kind":"cover","part":2,"stages":1,"points":[],"subtitle":"Part 2: Policy in Practice, Money, Output, and the Long Run","date":"November 5, 2026","sources":[]},{"id":"roadmap2","title":"Roadmap","kind":"roadmap","static":true,"part":2,"stages":1,"points":["Monetary policy in practice: inflation targeting, the output gap, the Taylor rule, the zero lower bound, and QE.","Money, output, and the long run: short- vs long-run effects and monetary neutrality.","Long-run changes: movements of money supply and money demand, then one checkpoint."],"sources":[]},{"id":"practiceoverview","title":"Inflation Targeting and the Output Gap","kind":"practiceOverview","part":2,"static":true,"stages":1,"table":[["Indicator","Meaning"],["Inflation target","The inflation rate the central bank aims for over time. The Fed’s longer-run goal is 2% PCE inflation."],["Output gap","How far real GDP is above or below potential GDP, as a percentage of potential GDP."]],"formula":"Output gap = 100 × (Y − Y*) / Y*","points":["If Y = 980 and Y* = 1,000, the output gap is −2%.","Use inflation and output forecasts to guide policy. The Fed also seeks maximum employment."],"sources":["inflationgoal","rules"]},{"id":"taylor","title":"The Taylor Rule","kind":"bullets","part":2,"stages":3,"formula":"i = r* + π + 0.5(π − π*) + 0.5g","table":[["r*: neutral real rate","π: inflation","π*: inflation target","g: output gap"],["2%","4%","2%","−2%"]],"points":["Start with r* + π = 2 + 4 = 6%.","Inflation above target adds 1 point; the negative output gap subtracts 1 point.","Suggested policy rate: 6%. The rule is a benchmark, not an automatic decision."],"sources":["rules"]},{"id":"zerobound","title":"The Zero Lower Bound","kind":"bullets","part":2,"stages":3,"points":["When the nominal policy rate is near 0%, there is little room for further conventional rate cuts.","Cash pays 0% interest. Deeply negative rates encourage people to switch to cash.","A Taylor rule may suggest a rate below zero. Other tools, including QE, can provide support."],"aside":"The effective lower bound can be slightly below zero.","sources":["lowerbound"]},{"id":"qe","title":"Quantitative Easing","kind":"bullets","part":2,"stages":4,"points":["QE: the central bank buys large amounts of longer-term bonds, such as Treasuries and mortgage-backed securities.","The purchases raise demand for those bonds. Their prices rise and their yields fall.","Lower longer-term borrowing costs can support consumption, investment, and aggregate demand.","QE can help when short-term rates are near zero. It does not guarantee more bank lending."],"sources":["qe"]},{"id":"shortlong","title":"Short- vs Long-Run Effects","kind":"comparison","part":2,"stages":2,"table":[["","Short run","Long run"],["Wages and prices","Adjust slowly","Have fully adjusted"],["Real output","Can move above or below potential","Returns to potential"],["Price level","Begins to change","Reflects the change in money supply"]],"points":["Monetary policy can change spending and real output in the short run.","A one-time money-supply change does not permanently change productive capacity."],"sources":["neutralmoney"]},{"id":"neutrality","title":"Monetary Neutrality","kind":"bullets","part":2,"stages":3,"points":["Monetary neutrality: a change in money supply changes nominal variables, but not real output in the long run.","If money supply rises by 10%, the long-run price level rises by 10%, with real output unchanged.","More dollars do not create more workers, machines, or technology."],"aside":"One-time change in money supply; full price adjustment; productive capacity unchanged.","sources":["neutralmoney"]},{"id":"longrunexpand","title":"Long-Run Changes: Monetary Expansion","kind":"graph","graph":"long_money_expand","part":2,"stages":3,"points":["Start: money supply is 600 and the interest rate is 4%.","MS shifts right to 800. With prices still fixed, the rate falls to 2%.","As prices rise, MD shifts right. In the long run, the rate returns to 4%; real output is unchanged."],"sources":["neutralmoney"]},{"id":"longruncontract","title":"Long-Run Changes: Monetary Contraction","kind":"graph","graph":"long_money_contract","part":2,"stages":3,"points":["Start: money supply is 600 and the interest rate is 4%.","MS shifts left to 400. With prices still fixed, the rate rises to 6%.","As prices fall, MD shifts left. In the long run, the rate returns to 4%; real output is unchanged."],"sources":["neutralmoney"]},{"id":"checkpoint2","title":"Monetary Neutrality Checkpoint","kind":"check","part":2,"stages":2,"points":["After a one-time increase in money supply and full price adjustment, does real output remain above potential? Explain the change in money demand."],"answer":"No. Real output returns to potential. Higher prices raise nominal money demand; the long-run price level is higher.","sources":["neutralmoney"]}],D={"objectives":{"A":["Understand money demand as a desired stock for payments and liquidity.","Explain how an investment’s return changes the opportunity cost of holding money.","Distinguish a movement along money demand from a shift caused by other conditions."],"B":["Explain the federal funds rate and the Fed’s influence on short-term rates.","Interpret money-market equilibrium and shifts in the supply of money.","Explain why longer-term rates reflect expectations and need not move one-for-one with today’s policy rate."],"C":["Explain how monetary policy affects consumption, investment, and aggregate demand.","Interpret policy-induced AD shifts while holding short-run aggregate supply fixed.","Demonstrate expansionary and contractionary effects on output and the price level."],"P":["Explain inflation targeting, calculate an output gap and interpret a Taylor-rule benchmark.","Explain the zero lower bound and quantitative easing.","Compare short- and long-run effects, explain neutrality, and trace MS and nominal MD shifts."]},"sources":{"fomc22":["FOMC, June 15, 2022","https://www.federalreserve.gov/newsevents/pressreleases/monetary20220615a.htm"],"fomc24":["FOMC, September 18, 2024","https://www.federalreserve.gov/newsevents/pressreleases/monetary20240918a.htm"],"implementation":["Federal Reserve Board: implementation and IORB","https://www.federalreserve.gov/monetarypolicy/iorb-faqs.htm"],"goals":["Federal Reserve Board: policy goals and transmission","https://www.federalreserve.gov/monetarypolicy/monetary-policy-what-are-its-goals-how-does-it-work.htm"],"rules":["Federal Reserve Board: policy rules","https://www.federalreserve.gov/monetarypolicy/policy-rules-and-how-policymakers-use-them.htm"],"bonds":["SEC Investor.gov: bonds","https://www.investor.gov/introduction-investing/investing-basics/investment-products/bonds-or-fixed-income-products/bonds"],"cds":["SEC Investor.gov: certificates of deposit","https://www.investor.gov/introduction-investing/investing-basics/investment-products/certificates-deposit-cds"],"fiscal":["IMF: fiscal policy","https://www.imf.org/en/Publications/fandd/issues/Series/Back-to-Basics/Fiscal-Policy"],"oecd":["OECD (2026), Financial market statistics: long-term interest rates (accessed November 2, 2026)","https://data-explorer.oecd.org/vis?df[ds]=dsDisseminateFinalDMZ&df[id]=DSD_STES%40DF_FINMARK&df[ag]=OECD.SDD.STES&df[vs]=4.0"],"oecdterms":["OECD data terms, section 3","https://www.oecd.org/en/about/terms-conditions.html"],"pollev":["Poll Everywhere: multiple-choice activities","https://www.polleverywhere.com/product/faq"],"inflationgoal":["Federal Reserve Board: inflation objective","https://www.federalreserve.gov/faqs/economy_14400.htm"],"lowerbound":["Federal Reserve Board: policy limits","https://www.federalreserve.gov/monetarypolicy/challenges-associated-with-using-rules-to-make-monetary-policy.htm"],"qe":["Federal Reserve Board: asset purchases and longer-term rates","https://www.federalreserve.gov/econres/notes/feds-notes/effect-of-the-federal-reserves-securities-holdings-on-longer-term-interest-rates-20170420.html"],"neutralmoney":["ECB: short-run effects and long-run neutrality","https://www.ecb.europa.eu/mopo/intro/role/html/index.en.html"]},"parts":[[{"id":"cover1","title":"Chapter 15: Monetary Policy","points":[],"kind":"cover","subtitle":"Part 1: Money Demand, Interest Rates, and Aggregate Demand","date":"November 3, 2026","part":1,"sources":[],"stages":1},{"id":"opening","title":"FOMC Decisions: Five Episodes","points":[],"kind":"table","sources":["fomc20","fomc21","fomc22","fomc23","fomc24"],"part":1,"stages":1,"static":true,"table":[["Case / date","Main concern","Target range","Bond policy","Intended effect"],["A · Mar 15, 2020","Pandemic; jobs at risk","Cut: 0–0.25%","Buy bonds","Support credit and jobs"],["B · Nov 3, 2021","Recovery; high inflation","Hold: 0–0.25%","Slow purchases","Reduce support gradually"],["C · Jun 15, 2022","High inflation","Raise: 1.50–1.75%","Reduce holdings","Reduce inflation pressure"],["D · Nov 1, 2023","Persistent inflation","Hold: 5.25–5.50%","Keep reducing holdings","Keep demand restrained"],["E · Sep 18, 2024","Inflation easing; slower hiring","Cut: 4.75–5.00%","Keep reducing holdings","Limit job weakness"]]},{"id":"roadmap1","title":"Learning Objectives","points":["A · Understand and explain demand for money.","B · Explain money-market equilibrium and the connection between money and interest rates.","C · Interpret aggregate-demand shifts and demonstrate the effects of monetary policy."],"kind":"roadmap","part":1,"sources":[],"stages":1},{"id":"sectionA","title":"15.1 Demand for Money","points":["Understand and explain demand for money."],"kind":"section","objective":"A","part":1,"sources":[],"stages":1},{"id":"pollstart","title":"Money or Bonds","points":["A household has $1,000 and needs $400 for bills next month.","Money earns 0%. The bond pays interest but cannot be cashed in early in this exercise.","Answer P1–P4: how much should the household keep available for payments?"],"kind":"poll","part":1,"sources":[],"stages":1},{"id":"return","title":"The Opportunity Cost of Holding Money","points":["For the 6% bond: $36 ÷ $600 = 6% per year.","Keeping $600 in money means giving up that interest.","When the bond rate rises from 1% to 6%, interest forgone rises from $6 to $36."],"kind":"table","table":[["Keep $600 for one year","Ending amount","Interest earned"],["Money at 0%","$600","$0"],["Bond at 1%","$606","$6"],["Bond at 6%","$636","$36"]],"sources":["bonds","cds"],"part":1,"stages":3,"formula":"Rate of return = (ending amount − starting amount) ÷ starting amount"},{"id":"classcurve","title":"Money Demand: P1–P3","points":["P1: at 1%, the example household keeps $800 for spending.","P2: at 6%, it keeps $400. This is a movement along MD₀.","P3: bills rise from $400 to $600, but the rate stays at 6%. MD shifts right to MD₁."],"graph":"class","part":1,"kind":"graph","sources":[],"stages":3,"step_titles":[]},{"id":"mdshifts","title":"Shifts in Money Demand","points":[],"kind":"shiftList","part":1,"sources":[],"stages":5,"factors":[["Price level","Higher prices require more dollars for the same purchases. MD shifts right."],["Real GDP","More output means more purchases and payments. MD shifts right."],["Credit and banking technology","Easier credit or faster payments can reduce cash buffers. MD may shift left."],["Banking institutions","Rules that require larger account balances raise money demand. MD shifts right."]]},{"id":"moneydemandcheck","title":"Money Demand Checkpoint","kind":"check","questions":[{"prompt":"Interest rates rise; prices and spending stay the same. Movement along MD or a shift?","answer":"Move up along MD: the quantity of money demanded falls."},{"prompt":"At the same interest rate, the same bills cost more dollars. Movement or shift?","answer":"MD shifts right: more money is needed for payments."}],"points":[],"sources":[],"part":1,"stages":3},{"id":"sectionB","title":"15.2 Money and Interest Rates","points":["Explain money-market equilibrium and the connection between money and interest rates."],"kind":"section","objective":"B","part":1,"sources":[],"stages":1},{"id":"ffr","title":"The Federal Funds Rate","points":["River Bank can borrow the missing $500 overnight from another bank. The rate it pays is the federal funds rate (FFR).","More reserves reduce banks’ need to borrow; fewer reserves increase it. When reserves are scarce, this affects the FFR.","The FOMC sets a target range for the FFR."],"sources":["goals","implementation"],"part":1,"kind":"table","stages":3,"table":[["River Bank today","Amount"],["Reserves available","$2,000"],["Payments due tonight","$2,500"],["Overnight loan needed","$500"]]},{"id":"fedchain","title":"A Fed Bond Purchase","points":["The Fed buys a $1,000 Treasury bond from River Bank.","It pays by adding $1,000 to River Bank’s reserves.","Reserves rise from $2,000 to $3,000. The bank no longer needs the $500 overnight loan.","This purchase adds reserves; it does not itself create a customer deposit."],"kind":"bankStory","aside":"Bank reserves and customer deposits are different.","sources":["implementation"],"part":1,"stages":4},{"id":"msexpand","title":"Expansionary Monetary Policy","points":["Start: money supply is 600 and the interest rate is 4%.","Money supply rises to 800. At 4%, people want to hold only 600.","People try to buy bonds. Bond prices rise and the interest rate falls to 2%."],"graph":"ms_expand","part":1,"kind":"graph","sources":[],"stages":3,"step_titles":["Starting equilibrium","More money supplied","Lower interest rate"]},{"id":"mscontract","title":"Contractionary Monetary Policy","points":["Start: money supply is 600 and the interest rate is 4%.","Money supply falls to 400. At 4%, people still want to hold 600.","People try to sell bonds. Bond prices fall and the interest rate rises to 6%."],"graph":"ms_contract","part":1,"kind":"graph","sources":[],"stages":3,"step_titles":["Starting equilibrium","Less money supplied","Higher interest rate"]},{"id":"excessmoney","title":"An Interest Rate above Equilibrium","points":["At 6%, people want to hold 400, but money supply is 600.","People try to buy bonds with the extra 200. Bond prices rise.","The interest rate falls to 4%. People are now willing to hold all 600."],"graph":"eq_high","part":1,"kind":"graph","sources":[],"stages":3,"step_titles":["More money than desired","Bond purchases","Money market clears"]},{"id":"moneyshortage","title":"An Interest Rate below Equilibrium","points":["At 2%, people want to hold 800, but money supply is only 600.","People try to sell bonds to obtain money. Bond prices fall.","The interest rate rises to 4%. People now want to hold 600."],"graph":"eq_low","part":1,"kind":"graph","sources":[],"stages":3,"step_titles":["Less money than desired","Bond sales","Money market clears"]},{"id":"mssummary","title":"Money Supply and Interest Rates","points":[],"kind":"table","static":true,"table":[["Change in money supply","Bond prices","Interest rate"],["MS rises","Rise","Falls"],["MS falls","Fall","Rises"]],"aside":"A bond’s future payments stay fixed: a higher price means a lower yield.","part":1,"sources":[],"stages":1},{"id":"moneymarketcheck","title":"Money-Market Checkpoint","kind":"check","questions":[{"prompt":"Money supply rises while MD stays fixed. What happens to the interest rate?","answer":"People try to buy bonds. Bond prices rise and the interest rate falls until people are willing to hold the larger money supply."},{"prompt":"The interest rate starts below equilibrium. Does selling bonds create more money?","answer":"No. Money moves between buyers and sellers. Bond prices fall and the rate rises, reducing the quantity of money people want to hold."}],"points":[],"sources":[],"part":1,"stages":3},{"id":"longrates","title":"Long-Term Interest Rates across Countries","points":["Read first: annual-average yields on approximately 10-year government bonds, in each country’s currency.","Compa function longMoney(s,k){
 const expand=s.graph==='long_money_expand',target=expand?800:400,color=expand?C.teal:C.red;
 const t=Math.max(0,Math.min(1,k-1)),u=Math.max(0,Math.min(1,k-2));
 const supply=600+(target-600)*t,price=1+(target/600-1)*u,rate=(1000-supply/price)/100;
 const X=m=>80+m*(640/1400),Y=i=>362-i*35;
 let out=text(80,23,'Nominal interest rate (%)','font-weight="bold" font-size="19"');
 out+=line(80,362,720,362,C.gray)+line(80,362,80,47,C.gray);
 for(const i of [0,2,4,6,8])out+=text(64,Y(i)+6,i,'text-anchor="end"');
 for(const m of [0,200,400,600,800,1000,1200,1400])out+=text(X(m),389,m,'text-anchor="middle" font-size="17"');
 out+=text(400,427,'Nominal quantity of money (model $ billions)','text-anchor="middle" font-size="18"');
 const curve=(factor,cl,label,extra='')=>line(X(100*factor),Y(9),X(1000*factor),Y(0),cl,extra)+text(X((label==='MD₁'?820:930)*factor)+8,Y(label==='MD₁'?1.8:.7)-5,label,`fill="${cl}" font-size="20" font-weight="bold"`);
 out+=curve(1,u>0?C.gray:C.blue,'MD₀',u>0?dash:'');
 if(u>0)out+=curve(price,color,'MD₁');
 if(t>0)out+=line(X(600),Y(0),X(600),Y(8.8),C.gray,dash)+text(X(600)+(expand?-10:10),Y(8.4),'MS₀',`text-anchor="${expand?'end':'start'}" fill="#6b7280" font-size="20"`);
 out+=line(X(supply),Y(0),X(supply),Y(8.8),t>0?color:C.navy)+text(X(supply)+10,Y(8.4),t>0?'MS₁':'MS₀',`fill="${t>0?color:C.navy}" font-size="20" font-weight="bold"`);
 out+=`<circle cx="${X(600)}" cy="${Y(4)}" r="6" fill="white" stroke="${C.gray}" stroke-width="2"/>`+text(X(600)-14,Y(4)-12,'E₀','text-anchor="end" fill="#6b7280" font-size="20"');
 if(u>0)out+=`<circle cx="${X(target)}" cy="${Y(expand?2:6)}" r="6" fill="white" stroke="${C.gray}" stroke-width="2"/>`+text(X(target)+12,Y(expand?2:6)+23,'E₁','fill="#6b7280" font-size="20"');
 out+=line(80,Y(rate),X(supply),Y(rate),color,dash)+line(X(supply),Y(rate),X(supply),362,color,dash);
 if(k>1.01)out+=dot(X(supply),Y(rate),k>=2.99?'E₂':k>=1.99?'E₁':'',color);
 if(t>0)out+=arrow(X(600),Y(7.4),X(supply),Y(7.4),color);
 if(u>0)out+=arrow(X(870),Y(1.3),X(870*price),Y(1.3),color);
 out+=text(80,459,k<2?'Start at the initial equilibrium.':k<3?'Short run: MS changes; prices are still fixed.':'Long run: prices change; MS stays fixed.','font-size="17"');
 return out+notes(s,Math.ceil(k));
}
function graph(s,k,counts){const body=s.graph.startsWith('long_money_')?longMoney(s,k):s.graph.startsWith('long_')?longRun(s,k):s.graph==='countries'?country(s,k):s.graph.startsWith('ad_')||s.graph==='supply'?adas(s,k):money(s,k,counts);return `<svg class="model" role="img" aria-label="${e(s.title)}. ${e(s.points.slice(0,k).join(' '))}" viewBox="0 0 1170 480"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>${body}</svg>`}
function table(s){if(!s.table)return '';return '<table><thead><tr>'+s.table[0].map(x=>'<th>'+e(x)+'</th>').join('')+'</tr></thead><tbody>'+s.table.slice(1).map(row=>'<tr>'+row.map(x=>'<td>'+e(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function body(s,k){if(s.graph)return graph(s,k);if(s.kind==='cover')return `<div class="coverbody"><p class="chapter">CHAPTER 15 · PRINCIPLES OF MACROECONOMICS</p><h2>${e(s.subtitle)}</h2><p>${e(s.date)}</p><p class="instructor">Guilherme Paiva Pinto · ECON_OX 112</p></div>`;
let out=(s.roadmap?'<p class=compact-roadmap>'+e(s.roadmap)+'</p>':'')+table(s);if(s.formula)out+=`<div class="formula">${e(s.formula)}</div>`;
const st=s.static||s.kind==='roadmap'||s.kind==='section'||s.kind==='poll';
out+=`<div class="points ${s.kind==='chain'?'chain':''} ${s.table?'aftertable':''}">`+s.points.map((p,i)=>`<p data-reveal="${st?1:i+1}" style="visibility:${(st||i<k)?'visible':'hidden'}"><span class="pointmark">${s.kind==='chain'?i+1:'•'}</span>${e(p)}</p>`).join('')+'</div>';
if(s.answer)out+=`<p class="answer" data-reveal="${s.stages}" style="visibility:${k===s.stages?'visible':'hidden'}"><b>Explanation.</b> ${e(s.answer)}</p>`;
if(s.aside)out+=`<p class="aside">${e(s.aside)}</p>`;return out}
function source(s){return s.sources.map(key=>`<a href="${e(D.sources[key][1])}">${e(D.sources[key][0])}</a>`).join(' · ')}
function slide(s,k,i,total){return `<section class="slide ${s.kind} ${s.id}" data-id="${s.id}" data-stage="${k}" data-stages="${s.stages}"><header><span class="public-brand">Emory University · Oxford College</span><span>ECON_OX 112 · Chapter 15</span></header><h1>${e(s.title)}</h1><div class="body">${body(s,k)}</div><div class="sources">${source(s)}</div><footer><span>Monetary Policy${s.graph==='countries'?' · OECD data terms apply':''}</span><span>${i+1} / ${total} · ${k} / ${s.stages}</span></footer></section>`}const dash="stroke-dasharray=\"7 6\"";
 function render(){
 const previous=document.querySelector('#viewport .slide'),same=previous?.dataset.id===slides[current].id,from=same?visual:stage;
 cancelAnimationFrame(animationFrame);visual=stage;
 document.getElementById('viewport').innerHTML=slide(slides[current],stage,current,slides.length);
 if(same&&slides[current].graph?.startsWith('long_money_')&&from!==stage){
  const slot=document.querySelector('#viewport .body'),started=performance.now(),end=stage,entry=slides[current],duration=matchMedia('(prefers-reduced-motion: reduce)').matches?0:850;
  slot.dataset.ready='false';
  function draw(now){const progress=duration?Math.min(1,(now-started)/duration):1,eased=progress*progress*(3-2*progress);visual=from+(end-from)*eased;slot.innerHTML=graph(entry,visual);if(progress<1)animationFrame=requestAnimationFrame(draw);else slot.dataset.ready='true'}
  animationFrame=requestAnimationFrame(draw);
 }
 document.getElementById('position').textContent=(current+1)+' / '+slides.length+' · Step '+stage+' / '+slides[current].stages;document.getElementById('notes').textContent=slides[current].note;document.getElementById('pollpanel').hidden=slides[current].id!=='classcurve';location.hash=(current+1)+'/'+stage;scale();if(slides[current].id==='classcurve'&&window.classMeans)document.querySelector('.model').outerHTML=graph(slides[current],stage,window.classMeans)}
 function next(){if(stage<slides[current].stages)stage++;else if(current<slides.length-1){current++;stage=1}render()}function back(){if(stage>1)stage--;else if(current>0){current--;stage=slides[current].stages}render()}function restart(){stage=1;render()}function go(i,k=1){current=Math.max(0,Math.min(i,slides.length-1));stage=Math.max(1,Math.min(k,slides[current].stages));render()}function scale(){let v=document.getElementById('viewport'),s=v.querySelector('.slide');let z=Math.min(innerWidth/1280,(innerHeight-58)/720);s.style.transform='scale('+z+')';v.style.width=1280*z+'px';v.style.height=720*z+'px'}
 document.getElementById('next').onclick=next;document.getElementById('back').onclick=back;document.getElementById('restart').onclick=restart;document.getElementById('toggleNotes').onclick=()=>document.getElementById('notes').classList.toggle('open');document.getElementById('apply').onclick=()=>{let means=[];for(let n=1;n<=3;n++){let ns=[...document.querySelectorAll('[data-poll="'+n+'"]')].map(x=>Number(x.value));if(ns.some(x=>!Number.isInteger(x)||x<0)||!ns.reduce((a,b)=>a+b,0)){document.getElementById('pollstatus').textContent='Enter nonnegative integer counts with a positive total for every poll.';return}let vals=n===3?[600,700,800,1000]:[400,600,800,1000];means.push(ns.reduce((a,b,i)=>a+b*vals[i],0)/ns.reduce((a,b)=>a+b,0))}window.classMeans=means;document.getElementById('pollstatus').textContent='Observed means: '+means.map(x=>'$'+x.toFixed(1)).join(', ');render()};document.getElementById('clearCounts').onclick=()=>{delete window.classMeans;document.getElementById('pollstatus').textContent='Schematic restored.';render()};
 addEventListener('keydown',ev=>{if(/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(ev.target.tagName))return;if(['ArrowRight',' ','PageDown'].includes(ev.key)){ev.preventDefault();next()}else if(['ArrowLeft','PageUp'].includes(ev.key)){ev.preventDefault();back()}else if(ev.key.toLowerCase()==='r')restart();else if(ev.key.toLowerCase()==='n')document.getElementById('notes').classList.toggle('open')});addEventListener('resize',scale);const h=location.hash.slice(1).split('/').map(Number);go((h[0]||1)-1,h[1]||1);window.courseDeck={go,next,back,restart,slides,getState:()=>({current,stage})};</script></body></html>
