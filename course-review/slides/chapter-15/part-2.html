et","Raises the suggested rate."],["Output below potential","Lowers the suggested rate."]],"sources":["rules"],"formula":"i = r* + π + 0.5(π − π*) + 0.5g","takeaway":"i is a nominal policy-rate benchmark.","input_table":[["r*: neutral real rate","π: inflation","π*: target","g: output gap"],["2%","4%","2%","−2%"]],"activity_prompt":"Calculate i. Compare your reasoning with a partner.","activity_answer":"i = 2 + 4 + 1 − 1 = 6%"},{"id":"zerobound","title":"The Zero Lower Bound","kind":"labels","stages":3,"points":["Nominal rates cannot fall far below zero.","People can hold cash instead.","QE targets longer-term borrowing costs."],"items":[["Limit","Nominal rates cannot fall far below zero."],["Reason","People can hold cash instead."],["Next tool","QE targets longer-term borrowing costs."]],"sources":["lowerbound"],"takeaway":"Some central banks have used slightly negative rates."},{"id":"qe","title":"Quantitative Easing","kind":"labels","stages":3,"points":["The central bank buys large amounts of longer-term bonds.","Higher bond prices mean lower yields.","Lower borrowing costs can support C and I."],"items":[["Action","The central bank buys large amounts of longer-term bonds."],["Bond market","Higher bond prices mean lower yields."],["Spending","Lower borrowing costs can support C and I."]],"sources":["qe"],"takeaway":"More reserves do not automatically mean more lending."},{"id":"shortlong","title":"Short- and Long-Run Effects","kind":"comparison","stages":2,"points":[],"sources":["neutralmoney"],"takeaway":"One-time money change; productive capacity fixed.","table":[["","Short run","Long run"],["Wages and prices","Sticky","Fully adjusted"],["Real output","Can change","At potential"],["Price level","Starts adjusting","Reflects money supply"]]},{"id":"neutrality","title":"Monetary Neutrality","kind":"neutrality","stages":3,"points":["Money changes prices, not real output.","Workers, capital and technology determine potential output."],"items":[["Long run","Money changes prices, not real output."],["Real capacity","Workers, capital and technology determine potential output."]],"sources":["neutralmoney"],"takeaway":"Full price adjustment; other long-run conditions fixed.","example_table":[["Money supply","Price level","Real output"],["+10%","+10%","Unchanged"]]},{"id":"longrunexpand","title":"Monetary Expansion","kind":"graph","stages":3,"points":["MS = 600; i = 4%.","MS rises to 800; i falls to 2%.","Prices rise. MD shifts right; i returns to 4%."],"sources":["neutralmoney"],"takeaway":"New MS stays at 800; potential output is unchanged.","graph":"long_money_expand","step_titles":["Start","Short run","Long run"],"condition":"One-time MS change; long-run expected inflation unchanged."},{"id":"longruncontract","title":"Monetary Contraction","kind":"graph","stages":3,"points":["MS = 600; i = 4%.","MS falls to 400; i rises to 6%.","Prices fall. MD shifts left; i returns to 4%."],"sources":["neutralmoney"],"takeaway":"New MS stays at 400; potential output is unchanged.","graph":"long_money_contract","step_titles":["Start","Short run","Long run"],"condition":"One-time MS change; long-run expected inflation unchanged."},{"id":"checkpoint2","title":"Long-Run Checkpoint","kind":"checkpoint","stages":2,"points":["Predict output, prices, and MD. Which curve moves first?"],"sources":["neutralmoney"],"activity_prompt":"Predict output, prices, and MD. Which curve moves first?","facts":"MS falls 20%. Prices fully adjust; other long-run conditions stay fixed.","answer_table":[["Real output","Price level","Nominal MD"],["Unchanged","−20%","Shifts left"]],"answer_reason":"MS moves first. Lower prices later shift MD left."}],sources={"inflationgoal":["Federal Reserve Board: inflation objective","https://www.federalreserve.gov/faqs/economy_14400.htm"],"rules":["Federal Reserve Board: policy rules","https://www.federalreserve.gov/monetarypolicy/policy-rules-and-how-policymakers-use-them.htm"],"lowerbound":["Federal Reserve Board: policy limits","https://www.federalreserve.gov/monetarypolicy/challenges-associated-with-using-rules-to-make-monetary-policy.htm"],"qe":["Federal Reserve Board: asset purchases and longer-term rates","https://www.federalreserve.gov/econres/notes/feds-notes/effect-of-the-federal-reserves-securities-holdings-on-longer-term-interest-rates-20170420.html"],"neutralmoney":["ECB: short-run effects and long-run neutrality","https://www.ecb.europa.eu/mopo/intro/role/html/index.en.html"]},brand="";
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'),reveal=(html,at,k,cls='')=>`<div class="reveal ${k>=at?'shown':''} ${cls}" data-reveal="${at}" aria-hidden="${k<at}">${html}</div>`;function table(rows,cls=''){return `<table class="${cls}"><thead><tr>${rows[0].map(t=>'<th>'+esc(t)+'</th>').join('')}</tr></thead><tbody>${rows.slice(1).map(row=>'<tr>'+row.map(t=>'<td>'+esc(t)+'</td>').join('')+'</tr>').join('')}</tbody></table>`}

function moneyState(kind,k){const target=kind==='long_money_expand'?800:400,a=Math.max(0,Math.min(1,k-1)),b=Math.max(0,Math.min(1,k-2)),money=600+(target-600)*a,price=1+(target/600-1)*b;return {target,a,b,money,price,rate:(1000-money/price)/100}}
function moneyGraph(kind,k){
 const s=moneyState(kind,k),expand=s.target===800,c=expand?'#007f78':'#b54332',gray='#91a0af',blue='#004c97';
 const X=m=>70+m*535/1400,Y=i=>328-i*31;
 const line=(x,y,xx,yy,color,width=3,dash='')=>`<path d="M${X(x)} ${Y(y)}L${X(xx)} ${Y(yy)}" fill="none" stroke="${color}" stroke-width="${width}" stroke-dasharray="${dash}"/>`;
 const text=(x,y,t,color='#172f45',dx=0,dy=0,anchor='start')=>`<text x="${X(x)+dx}" y="${Y(y)+dy}" fill="${color}" font-size="17" text-anchor="${anchor}" paint-order="stroke" stroke="white" stroke-width="3">${esc(t)}</text>`;
 const dot=(m,i,name,color,open=false,dx=10,dy=-11)=>`<circle cx="${X(m)}" cy="${Y(i)}" r="5.5" fill="${open?'white':color}" stroke="${open?color:'white'}" stroke-width="2"/>`+(name?text(m,i,name,color,dx,dy,dx<0?'end':'start'):'');
 const arrow=(x,y,xx,yy,color)=>{const a=X(x),b=Y(y),c=X(xx),d=Y(yy),length=Math.hypot(c-a,d-b);if(length<2)return '';const u=(c-a)/length,v=(d-b)/length;return `<path d="M${a} ${b}L${c} ${d}" stroke="${color}" stroke-width="2.5"/><path d="M${c} ${d}L${c-8*u+4*v} ${d-8*v-4*u}L${c-8*u-4*v} ${d-8*v+4*u}Z" fill="${color}"/>`};
 let out='<svg class="money-model" viewBox="0 0 640 410" role="img" aria-label="Nominal money-market adjustment: money supply changes first; price adjustment later shifts nominal money demand.">';
 out+='<text x="70" y="20" font-size="17" font-weight="700">Nominal interest rate (%)</text>';
 out+=line(0,0,1400,0,gray,1.5)+line(0,0,0,9,gray,1.5);
 for(const i of [0,2,4,6,8])out+=text(0,i,i,'#172f45',-12,5,'end');
 for(const m of [0,200,400,600,800,1000,1200,1400])out+=text(m,0,m,'#172f45',0,24,'middle');
 out+='<text x="335" y="389" font-size="17" text-anchor="middle">Nominal quantity of money (model $ billions)</text>';
 const md=(scale,color,label,dash='')=>line(100*scale,9,1000*scale,0,color,3,dash)+text((label==='MD₁'?750:930)*scale,label==='MD₁'?2.5:.7,label,color,8,-7);
 out+=md(1,s.b>0?gray:blue,'MD₀',s.b>0?'7 5':'');if(s.b>0)out+=md(s.price,c,'MD₁');
 if(s.a>0)out+=line(600,0,600,8.8,gray,2,'7 5')+text(600,8.35,'MS₀',gray,expand?-10:10,0,expand?'end':'start');
 out+=line(s.money,0,s.money,8.8,s.a>0?c:'#00305f',3.5)+text(s.money,8.35,s.a>0?'MS₁':'MS₀',s.a>0?c:'#00305f',10,0);
 if(s.a>0)out+=dot(600,4,'E₀',gray,true,-12,-10);
 if(s.b>0)out+=dot(s.target,expand?2:6,'E₁',gray,true,10,23);
 out+=line(0,s.rate,s.money,s.rate,c,1.5,'3 5');
 out+=dot(s.money,s.rate,k>=2.99?'E₂':k>=1.99?'E₁':k<=1.01?'E₀':'',c);
 if(s.a>0)out+=arrow(600,7.55,s.money,7.55,c);if(s.b>0)out+=arrow(860,1.4,860*s.price,1.4,c);
 return out+'</svg>';
}

 if(s.graph)return `<div class="part2-graph-layout"><div><div class="plot-slot" data-ready="true">${moneyGraph(s.graph,visual)}</div><p class="condition">${esc(s.condition)}</p></div><div class="graph-reasoning">${s.points.map((t,i)=>reveal('<h3>'+esc(s.step_titles[i])+'</h3><p>'+esc(t)+'</p>',i+1,k,'graph-step')).join('')}</div></div><p class="takeaway graph-takeaway">${esc(s.takeaway)}</p>`;
 if(s.kind==='indicators')return cues(s.items,k)+`<p class="formula">${esc(s.formula)}</p><p class="formula-legend">${esc(s.formula_legend)}</p>`+reveal('<p class="example-line">'+esc(s.example)+'</p>',3,k)+`<p class="takeaway">${esc(s.takeaway)}</p>`;
 if(s.kind==='taylor')return `<p class="formula">${esc(s.formula)}</p>${table(s.input_table,'inputs')}<div class="rate-directions">${s.items.map(([h,t])=>'<p><strong>'+esc(h)+':</strong> '+esc(t)+'</p>').join('')}</div>`+reveal('<p class="activity-prompt">'+esc(s.activity_prompt)+'</p>',2,k)+reveal('<p class="result">'+esc(s.activity_answer)+'</p>',3,k)+`<p class="takeaway">${esc(s.takeaway)}</p>`;
 if(s.kind==='comparison')return table(s.table,'comparison-table')+reveal('<p class="takeaway">'+esc(s.takeaway)+'</p>',2,k);
 if(s.kind==='neutrality')return cues(s.items,k)+reveal(table(s.example_table,'neutral-example'),3,k)+`<p class="takeaway">${esc(s.takeaway)}</p>`;
 if(s.kind==='checkpoint')return `<p class="facts">${esc(s.facts)}</p><p class="activity-prompt">${esc(s.activity_prompt)}</p>`+reveal(table(s.answer_table,'checkpoint-answer')+'<p class="answer-reason">'+esc(s.answer_reason)+'</p>',2,k,'answer');
 return cues(s.items,k)+`<p class="takeaway">${esc(s.takeaway)}</p>`;
}
function fullSlide(s,k,i){const credit=s.sources.map(key=>`<a href="${esc(sources[key][1])}">${esc(sources[key][0])}</a>`).join(' · ');return `<section class="slide ${s.id} ${s.kind}${s.kind==='cover'?' title-slide':''}" data-id="${s.id}" data-stage="${k}"><div class="monetary-slide"><div class="${s.kind==='cover'?'':'content-title'}">${s.kind==='cover'?'':'<h1>'+esc(s.title)+'</h1>'}</div><div class="slide-body${s.kind==='cover'?' cover-body':''}">${body(s,k)}</div><div class="sources">${credit}</div></div><footer><span>ECON_OX 112 · Chapter 15 · Monetary Policy</span><span>${i+1} / ${slides.length} · ${k} / ${s.stages}</span></footer></section>`}
let current=0,stage=1,visual=1,frame;
function scale(){const v=document.getElementById('viewport'),s=v.querySelector('.slide'),z=Math.min(innerWidth/1200,(innerHeight-56)/675);s.style.transform='scale('+z+')';v.style.width=1200*z+'px';v.style.height=675*z+'px'}
function render(){const entry=slides[current],old=document.querySelector('.slide'),from=old?.dataset.id===entry.id?visual:stage;cancelAnimationFrame(frame);visual=stage;document.getElementById('viewport').innerHTML=fullSlide(entry,stage,current);document.getElementById('position').textContent=(current+1)+' / '+slides.length+' · Step '+stage+' / '+entry.stages;document.getElementById('jump').value=current;document.getElementById('back').disabled=current===0&&stage===1;document.getElementById('next').disabled=current===slides.length-1&&stage===entry.stages;document.getElementById('restart').disabled=stage===1;history.replaceState(null,'','#'+(current+1)+'/'+stage);scale();
if(entry.graph&&from!==stage){const slot=document.querySelector('.plot-slot'),start=performance.now(),end=stage,duration=matchMedia('(prefers-reduced-motion:reduce)').matches?0:850;slot.dataset.ready='false';function draw(now){const p=duration?Math.min(1,(now-start)/duration):1,e=p*p*(3-2*p);visual=from+(end-from)*e;slot.innerHTML=moneyGraph(entry.graph,visual);if(p<1)frame=requestAnimationFrame(draw);else slot.dataset.ready='true'}frame=requestAnimationFrame(draw)}}
function go(i,k=1){current=Math.max(0,Math.min(slides.length-1,i));stage=Math.max(1,Math.min(slides[current].stages,k));render()}
function next(){if(stage<slides[current].stages)stage++;else if(current<slides.length-1){current++;stage=1}render()}
function back(){if(stage>1)stage--;else if(current>0){current--;stage=slides[current].stages}render()}
function restart(){stage=1;render()}
document.getElementById('next').onclick=next;document.getElementById('back').onclick=back;document.getElementById('restart').onclick=restart;document.getElementById('jump').onchange=e=>go(+e.target.value,1);
addEventListener('resize',scale);addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT|A)$/.test(e.target.tagName)||(e.target.tagName==='BUTTON'&&[' ','Enter'].includes(e.key)))return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();back()}else if(e.key.toLowerCase()==='r')restart()});const h=location.hash.slice(1).split('/').map(Number);go((h[0]||1)-1,h[1]||1);window.courseDeck={go,next,back,restart,slides,getState:()=>({current,stage})};</script></body></html>
