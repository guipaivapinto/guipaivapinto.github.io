.public-brand{color:#00305f;font-size:21px;font-weight:600}.live .chapter-nav{font-size:14px;margin-left:12px}.live .chapter-nav a{color:#00305f;margin-left:12px}html{scroll-behavior:auto}button:focus-visible,a:focus-visible{outline:3px solid #f2a900;outline-offset:2px}</style></head><body class="live"><main id="viewport" aria-live="polite"></main><nav aria-label="Slide navigation"><button id="back">← Back</button><button id="next">Next →</button><button id="restart">Restart slide</button><span id="position"></span><span class="chapter-nav"><a href="./">Chapter15</a><a href="credits.html">Sources</a></span></nav><script>const slides=[{"id":"cover2","title":"Monetary Policy in Practice","points":[],"kind":"cover","subtitle":"Output gaps, the Taylor rule, and inflation targeting","date":"November 5, 2026","part":2,"sources":[],"stages":1},{"id":"roadmap2","title":"Learning Objectives","points":["Measure output gaps and evaluate policy responses to demand and supply shocks.","Calculate and interpret a standard Taylor-rule benchmark.","Compare a policy-rate rule with an inflation-targeting framework and explain their limits."],"kind":"roadmap","part":2,"sources":[],"stages":1},{"id":"dualmandate","title":"Choosing a Policy Response","points":["The Fed pursues maximum employment and price stability. Its longer-run inflation goal is 2% PCE inflation.","Compare actual output with sustainable potential output; evaluate inflation and its expected path.","A demand shortfall and a supply disruption can produce different policy tradeoffs."],"sources":["goals"],"part":2,"kind":"bullets","stages":3},{"id":"outputgap","title":"Measuring the Output Gap","points":["Output gap = 100 × (actual GDP − potential GDP) ÷ potential GDP.","Shortfall: 100 × (980 − 1,000) ÷ 1,000 = −2%.","Pressure: 100 × (1,020 − 1,000) ÷ 1,000 = +2%."],"kind":"table","table":[["Hypothetical case","Actual real GDP","Potential real GDP","Output gap"],["Demand shortfall","980","1,000","Calculate"],["Demand pressure","1,020","1,000","Calculate"]],"aside":"All GDP inputs are original illustrations in the same real units; potential GDP is estimated.","part":2,"sources":[],"stages":3},{"id":"practicegapnegative","title":"Responding to a Negative Output Gap","points":["A negative demand shock leaves output below potential.","If inflation pressure is subdued, easing can support C and I.","AD moves right toward the fixed potential-output line.","Output rises toward potential; the price level rises relative to the weak-demand outcome."],"graph":"ad_expand","part":2,"kind":"graph","sources":[],"stages":4},{"id":"practicegappositive","title":"Responding to a Positive Output Gap","points":["Strong aggregate demand puts output above sustainable potential.","If inflation pressure is excessive, tightening can restrain C and I.","AD moves left toward the fixed potential-output line.","Output pressure eases, with a lower price level than without tightening."],"graph":"ad_contract","part":2,"kind":"graph","sources":[],"stages":4},{"id":"supplytradeoff","title":"When Output and Inflation Disagree","points":["An adverse supply shock shifts SRAS left/up.","Output falls below potential while the price level rises.","Easing AD can support output but adds price pressure; tightening AD can reduce price pressure but deepen the output loss."],"graph":"supply","part":2,"kind":"graph","sources":[],"stages":3},{"id":"taylor","title":"A Standard Taylor Rule","points":["i: nominal policy-rate benchmark; r*: neutral real rate.","π: inflation; π*: inflation goal; g: output gap in percent.","Higher inflation relative to the goal or a larger output gap raises the benchmark, holding other inputs fixed."],"kind":"formula","formula":"i = r* + π + 0.5(π − π*) + 0.5g","aside":"Illustrative 1993-style rule. Rates and gaps enter as percentage numbers, such as 4 and −2.","sources":["rules"],"part":2,"stages":3},{"id":"taylorexample","title":"Calculating a Policy-Rate Benchmark","points":["Baseline term: r* + π = 2 + 4 = 6.","Inflation response: 0.5 × (4 − 2) = +1.","Output response: 0.5 × (−2) = −1.","Benchmark: i = 6 + 1 − 1 = 6%."],"kind":"table","table":[["Fixed illustrative input","Value"],["Neutral real rate r*","2%"],["Inflation goal π*","2%"],["Current inflation π","4%"],["Output gap g","−2%"]],"sources":["rules"],"part":2,"stages":4},{"id":"taylorprinciple","title":"Why the Rule Responds to Inflation","points":["One extra percentage point of inflation adds 1 point through π and 0.5 point through the inflation-gap term.","The nominal rate rises by 1.5 percentage points.","If expected inflation rises by 1 point too, the approximate real rate rises by 0.5 point."],"kind":"formula","formula":"Δi = 1.5 × Δπ  (holding r*, π*, and g fixed)","sources":["rules"],"part":2,"stages":3},{"id":"targeting","title":"Inflation Targeting","points":["An inflation-targeting framework states an inflation objective and uses forecasts, communication, and policy actions to pursue it over time.","For the Fed, the longer-run objective is 2% PCE inflation, alongside maximum employment.","Policy can respond to expected inflation and employment conditions before inflation reaches the goal."],"sources":["goals"],"part":2,"kind":"bullets","stages":3},{"id":"fomcreturn","title":"The September 2024 Decision","points":["The committee considered progress on inflation and risks to both employment and inflation.","A cut before inflation reaches 2% can reflect a forward-looking judgment. The statement does not prove a specific Taylor-rule calculation."],"kind":"comparison","table":[["Case E · September 18, 2024","Policy fact"],["Target range change","Cut by 0.50 percentage point"],["New target range","4.75–5.00%"],["Statement context","Inflation still somewhat elevated; greater confidence in progress toward 2%"]],"sources":["fomc24"],"part":2,"stages":2},{"id":"comparison","title":"Taylor Rule and Inflation Targeting","points":[],"kind":"table","static":true,"table":[["Comparison","Taylor-rule benchmark","Inflation-targeting framework"],["Main question","What policy rate do these inputs imply?","What outcome should policy pursue over time?"],["Central inputs","Inflation, inflation gap, output gap, r*","Inflation objective, forecasts, risks, broader mandate"],["Type of guidance","A numerical instrument guide","An objective and decision framework"],["Can they coexist?","Yes: a rule can inform the rate decision.","Yes: the target can anchor the rule."]],"sources":["rules","goals"],"part":2,"stages":1},{"id":"limits","title":"Why Policymakers Use Judgment","points":["Potential output and the neutral real rate are estimates that can change.","Inflation measures and forecasts can disagree; effects of policy arrive with lags.","The effective lower bound can limit conventional rate cuts. A formula can prescribe an infeasible rate."],"sources":["rules","goals"],"part":2,"kind":"bullets","stages":3},{"id":"taylorcheck","title":"Try the Rule","points":["Calculate the nominal policy-rate benchmark.","Explain why a negative output gap pushes the benchmark downward."],"kind":"check","table":[["Fixed input","Value"],["r* and π*","2% each"],["Inflation π","3%"],["Output gap g","−4%"]],"answer":"i = 2 + 3 + 0.5(3 − 2) + 0.5(−4) = 3.5%. The output-gap term contributes −2 percentage points.","part":2,"sources":[],"stages":3},{"id":"policybrief","title":"Write a Conditional Policy Recommendation","points":["For each case, recommend a direction and trace the channel through AD.","Calculate a Taylor benchmark using r* = 2%, π* = 2%, then explain what the number leaves unresolved.","Name one piece of evidence that could change your recommendation."],"kind":"table","table":[["Hypothetical economy","Inflation","Output gap","Shock"],["A","1%","−3%","Demand shortfall"],["B","5%","−3%","Adverse supply shock"]],"answer":"A: benchmark 1%; easing can support weak demand if conditions allow. B: benchmark 7%; inflation and output signals conflict, so discuss the tradeoff, expectations, persistence, and other available tools before choosing a response.","sources":["rules"],"part":2,"stages":4},{"id":"close2","title":"Policy Reasoning","points":["Identify the shock and the output gap before recommending a policy.","Use a rule to organize the evidence; distinguish a benchmark from a binding decision.","Explain the expected channel, the tradeoff, and the condition that could change your answer."],"kind":"check","answer":"An output gap describes the economy’s position. A policy rule supplies a numerical cross-check. An inflation objective and mandate guide the decision over time.","part":2,"sources":[],"stages":4}],D={"objectives":{"A":["Understand money demand as a desired stock for payments and liquidity.","Explain how an investment’s return changes the opportunity cost of holding money.","Distinguish a movement along money demand from a shift caused by other conditions."],"B":["Explain the federal funds rate and the Fed’s influence on short-term rates.","Interpret money-market equilibrium and shifts in the supply of money.","Explain why longer-term rates reflect expectations and need not move one-for-one with today’s policy rate."],"C":["Explain how monetary policy affects consumption, investment, and aggregate demand.","Interpret policy-induced AD shifts while holding short-run aggregate supply fixed.","Demonstrate expansionary and contractionary effects on output and the price level."],"P":["Measure output gaps and evaluate policy responses to demand and supply shocks.","Calculate and interpret a standard Taylor-rule benchmark.","Compare a policy-rate rule with an inflation-targeting framework and explain their limits."]},"sources":{"fomc22":["FOMC, June 15, 2022","https://www.federalreserve.gov/newsevents/pressreleases/monetary20220615a.htm"],"fomc24":["FOMC, September 18, 2024","https://www.federalreserve.gov/newsevents/pressreleases/monetary20240918a.htm"],"implementation":["Federal Reserve Board: implementation and IORB","https://www.federalreserve.gov/monetarypolicy/iorb-faqs.htm"],"goals":["Federal Reserve Board: policy goals and transmission","https://www.federalreserve.gov/monetarypolicy/monetary-policy-what-are-its-goals-how-does-it-work.htm"],"rules":["Federal Reserve Board: policy rules","https://www.federalreserve.gov/monetarypolicy/policy-rules-and-how-policymakers-use-them.htm"],"bonds":["SEC Investor.gov: bonds","https://www.investor.gov/introduction-investing/investing-basics/investment-products/bonds-or-fixed-income-products/bonds"],"cds":["SEC Investor.gov: certificates of deposit","https://www.investor.gov/introduction-investing/investing-basics/investment-products/certificates-deposit-cds"],"fiscal":["IMF: fiscal policy","https://www.imf.org/en/Publications/fandd/issues/Series/Back-to-Basics/Fiscal-Policy"],"oecd":["OECD (2026), Financial market statistics: long-term interest rates (accessed November 2, 2026)","https://data-explorer.oecd.org/vis?df[ds]=dsDisseminateFinalDMZ&df[id]=DSD_STES%40DF_FINMARK&df[ag]=OECD.SDD.STES&df[vs]=4.0"],"oecdterms":["OECD data terms, section 3","https://www.oecd.org/en/about/terms-conditions.html"],"pollev":["Poll Everywhere: multiple-choice activities","https://www.polleverywhere.com/product/faq"]},"parts":[[{"id":"cover1","title":"Monetary Policy","points":[],"kind":"cover","subtitle":"Money demand, interest rates, and aggregate demand","date":"November 3, 2026","part":1,"sources":[],"stages":1},{"id":"opening","title":"Two FOMC Decisions","points":["The 2024 cut left the target range above its level after the 2022 increase.","How could either decision change the money people hold and the purchases firms make?"],"kind":"comparison","table":[["Earlier decision cards","June 15, 2022 · Case C","September 18, 2024 · Case E"],["Change in target range","Increase of 0.75 percentage point","Decrease of 0.50 percentage point"],["New target range","1.50–1.75%","4.75–5.00%"]],"sources":["fomc22","fomc24"],"part":1,"stages":2},{"id":"roadmap1","title":"Learning Objectives","points":["A · Understand and explain demand for money.","B · Explain money-market equilibrium and the connection between money and interest rates.","C · Interpret aggregate-demand shifts and demonstrate the effects of monetary policy."],"kind":"roadmap","part":1,"sources":[],"stages":1},{"id":"sectionA","title":"15.1 Demand for Money","points":["Understand money demand as a desired stock for payments and liquidity.","Explain how an investment’s return changes the opportunity cost of holding money.","Distinguish a movement along money demand from a shift caused by other conditions."],"kind":"section","objective":"A","part":1,"sources":[],"stages":1},{"id":"pollstart","title":"Money for Bills or Money for a Return?","points":["Use the separate PollEv activity: P1–P4. All amounts, rates, and contracts are hypothetical.","Choose for the fictional household. Keep enough money for its upcoming bills.","Keep your reasoning: we will use the first responses to build a money-demand comparison."],"kind":"poll","part":1,"sources":[],"stages":1},{"id":"return","title":"The Opportunity Cost of Holding Money","points":["Rate of return = (ending value − initial value) ÷ initial value.","A higher return on the alternative makes a liquid balance more costly to hold.","Compare with the return paid on money itself; today the activity holds that return at 0%."],"kind":"table","table":[["Holding $600 for one year","Ending balance","Interest forgone by holding money"],["Cash/checking at 0%","$600","—"],["One-year bond at 1%","$606","$6"],["One-year bond at 6%","$636","$36"]],"sources":["bonds","cds"],"part":1,"stages":3},{"id":"classcurve","title":"From Choices to Money Demand","points":["P1 → P2: only the one-year return rises, from 1% to 6%.","At a higher short-term rate, the model predicts a smaller quantity of money demanded.","P2 → P3: bills become more expensive at the same 6% rate. That is a demand shift."],"graph":"class","part":1,"kind":"graph","sources":[],"stages":3},{"id":"mdcurve","title":"The Demand for Money","points":["Hold the price level, real GDP, payment arrangements, and money’s own return fixed.","A rise in the short-term nominal interest rate raises the cost of holding money.","Move upward along MD: less money is desired for liquidity at the higher rate."],"graph":"md","part":1,"kind":"graph","sources":[],"stages":3},{"id":"mdshifts","title":"Shifts in Money Demand","points":["Price level ↑ → the same real purchases require more dollars → MD shifts right.","Real GDP ↑ → more real transactions at given prices → MD shifts right.","Easier access to short-term credit can reduce the balances needed between paydays → MD may shift left.","Faster, reliable banking and payments can reduce idle balances → MD may shift left.","Institutions that require larger cash buffers can raise desired balances → MD shifts right."],"kind":"bullets","part":1,"sources":[],"stages":5},{"id":"sectionB","title":"15.2 Money and Interest Rates","points":["Explain the federal funds rate and the Fed’s influence on short-term rates.","Interpret money-market equilibrium and shifts in the supply of money.","Explain why longer-term rates reflect expectations and need not move one-for-one with today’s policy rate."],"kind":"section","objective":"B","part":1,"sources":[],"stages":1},{"id":"ffr","title":"The Federal Funds Rate","points":["Some banks lend reserve balances to other institutions overnight. The federal funds rate is the rate on those loans.","The FOMC announces a target range; the market determines the effective rate.","The Fed influences this overnight rate, which helps shape other short-term rates and broader financial conditions."],"sources":["goals","implementation"],"part":1,"kind":"bullets","stages":3},{"id":"fedchain","title":"From a Fed Purchase to Money Supply","points":["Recall the previous class: the Fed buys a Treasury security from a nonbank seller.","The payment credits the seller’s bank with reserves; the bank credits the seller’s deposit.","The monetary base rises; the seller now holds a deposit instead of a security. In this model, MS shifts right.","The interest rate adjusts along the existing MD curve. Policy did not directly shift MD."],"kind":"chain","aside":"Today’s ample-reserves system relies mainly on administered rates such as IORB to steer overnight rates. A rate cut does not require a matching bond purchase.","sources":["implementation"],"part":1,"stages":4},{"id":"msexpand","title":"Expansionary Monetary Policy","points":["Start at MS₀ = 600 and i₀ = 4%.","In the money-supply model, a purchase raises MS to 800.","At 4%, people hold more money than they desire; they seek bonds and other assets.","Bond prices rise and yields fall. New equilibrium: i₁ = 2%, M₁ = 800."],"graph":"ms_expand","part":1,"kind":"graph","sources":[],"stages":4},{"id":"mscontract","title":"Contractionary Monetary Policy","points":["Start at MS₀ = 600 and i₀ = 4%.","In the money-supply model, a sale reduces MS to 400.","At 4%, people desire more money than is available; they sell assets to obtain balances.","Bond prices fall and yields rise. New equilibrium: i₁ = 6%, M₁ = 400."],"graph":"ms_contract","part":1,"kind":"graph","sources":[],"stages":4},{"id":"excessmoney","title":"Why a High Rate Does Not Persist","points":["Suppose i = 6%: MD = 400 but MS = 600. Desired money holdings are below the available stock.","People try to exchange excess balances for bonds. The money remains in the system when it changes hands.","Bidding raises bond prices and lowers yields. A $100 one-year payoff rises from $94.34 to $96.15.","At i = 4%, desired and available money both equal 600: the adjustment pressure ends."],"graph":"eq_high","part":1,"kind":"graph","sources":[],"stages":4},{"id":"moneyshortage","title":"Why a Low Rate Does Not Persist","points":["Suppose i = 2%: MD = 800 but MS = 600. People want more liquid balances.","Households sell bonds to build balances for rent and bills; not everyone can raise money holdings at once.","Bond prices fall and yields rise. A $100 one-year payoff falls from $98.04 to $96.15.","At i = 4%, desired and available money both equal 600."],"graph":"eq_low","part":1,"kind":"graph","sources":[],"stages":4},{"id":"mssummary","title":"Money-Market Effects","points":[],"kind":"table","static":true,"table":[["Policy in the model","Money supply","Bond price","Short-term rate"],["Expansionary purchase","Increases","Rises","Falls"],["Contractionary sale","Decreases","Falls","Rises"]],"aside":"Hold money demand, the price level, real GDP, and money’s own return fixed.","part":1,"sources":[],"stages":1},{"id":"longrates","title":"Long-Term Interest Rates across Countries","points":["Read first: annual-average yields on approximately 10-year government bonds, in each country’s currency.","Compare Japan and the United States: their yields differ despite the same broad maturity.","The rates rise after 2021 in all four series, by different amounts. The chart alone does not identify the cause."],"graph":"countries","sources":["oecd","oecdterms"],"part":1,"kind":"graph","stages":3},{"id":"pollreturn","title":"One Year or Two Years?","points":["Answer PollEv P5 and P6 before the payoff appears.","P5: $600 × 1.05² = $661.50; rolling gives $636.48. The two-year contract pays more.","P6: rolling gives $600 × 1.04 × 1.08 = $673.92. The one-year strategy pays more."],"kind":"table","table":[["Invest $600 for two years","Year 1 rate","Year 2 rate"],["Two-year contract, annual compounding","5% fixed","5% fixed"],["Roll one-year investments: P5","4%","2% scenario"],["Roll one-year investments: P6","4%","8% scenario"]],"part":1,"sources":[],"stages":3},{"id":"termrates","title":"Why Maturity Matters","points":["A longer-term yield reflects the expected path of short-term rates and compensation for holding longer-term risk.","A change in today’s policy rate may already be anticipated; a 10-year yield need not change by the same amount.","Longer maturity is different from the macroeconomic long run. A two-year investment is longer than a one-year investment; the data chart uses a 10-year benchmark."],"sources":["bonds","goals"],"part":1,"kind":"bullets","stages":3},{"id":"sectionC","title":"15.3 Monetary Policy and Aggregate Demand","points":["Explain how monetary policy affects consumption, investment, and aggregate demand.","Interpret policy-induced AD shifts while holding short-run aggregate supply fixed.","Demonstrate expansionary and contractionary effects on output and the price level."],"kind":"section","objective":"C","part":1,"sources":[],"stages":1},{"id":"policychoice","title":"Fiscal and Monetary Policy","points":["Automatic stabilizers can act without a new law; discretionary fiscal measures may take time to enact.","The choice also depends on inflation, implementation delays, debt capacity, and the type of shock. A supply loss is not repaired simply by adding demand."],"kind":"table","table":[["Policy choice","Main route","When especially useful"],["Monetary policy","Changes financial conditions; affects C and I","Broad demand management with room to adjust rates"],["Fiscal policy","Government purchases, taxes, and transfers","Direct purchases or support targeted to affected groups"],["A coordinated response","Combines instruments","Severe downturns, especially near the effective lower bound"]],"sources":["fiscal","goals"],"part":1,"stages":2},{"id":"transmission","title":"From Interest Rates to Aggregate Demand","points":["A lower policy rate can ease broader borrowing and financial conditions.","Lower relevant real borrowing costs can encourage consumption and investment.","A $10,000 project paying $10,500 next year loses money with a $10,600 repayment but gains with a $10,400 repayment.","At a given price level, higher C and I raise planned expenditure: AD shifts right."],"kind":"chain","aside":"Transmission is conditional: expected inflation, credit access, risk, and confidence also matter.","sources":["goals"],"part":1,"stag le":"Choosing a Policy Response","points":["The Fed pursues maximum employment and price stability. Its longer-run inflation goal is 2% PCE inflation.","Compare actual output with sustainable potential output; evaluate inflation and its expected path.","A demand shortfall and a supply disruption can produce different policy tradeoffs."],"sources":["goals"],"part":2,"kind":"bullets","stages":3},{"id":"outputgap","title":"Measuring the Output Gap","points":["Output gap = 100 × (actual GDP − potential GDP) ÷ potential GDP.","Shortfall: 100 × (980 − 1,000) ÷ 1,000 = −2%.","Pressure: 100 × (1,020 − 1,000) ÷ 1,000 = +2%."],"kind":"table","table":[["Hypothetical case","Actual real GDP","Potential real GDP","Output gap"],["Demand shortfall","980","1,000","Calculate"],["Demand pressure","1,020","1,000","Calculate"]],"aside":"All GDP inputs are original illustrations in the same real units; potential GDP is estimated.","part":2,"sources":[],"stages":3},{"id":"practicegapnegative","title":"Responding to a Negative Output Gap","points":["A negative demand shock leaves output below potential.","If inflation pressure is subdued, easing can support C and I.","AD moves right toward the fixed potential-output line.","Output rises toward potential; the price level rises relative to the weak-demand outcome."],"graph":"ad_expand","part":2,"kind":"graph","sources":[],"stages":4},{"id":"practicegappositive","title":"Responding to a Positive Output Gap","points":["Strong aggregate demand puts output above sustainable potential.","If inflation pressure is excessive, tightening can restrain C and I.","AD moves left toward the fixed potential-output line.","Output pressure eases, with a lower price level than without tightening."],"graph":"ad_contract","part":2,"kind":"graph","sources":[],"stages":4},{"id":"supplytradeoff","title":"When Output and Inflation Disagree","points":["An adverse supply shock shifts SRAS left/up.","Output falls below potential while the price level rises.","Easing A out+=`<div class="points ${s.kind==='chain'?'chain':''} ${s.table?'aftertable':''}">`+s.points.map((p,i)=>`<p data-reveal="${st?1:i+1}" style="visibility:${(st||i<k)?'visible':'hidden'}"><span class="pointmark">${s.kind==='chain'?i+1:'•'}</span>${e(p)}</p>`).join('')+'</div>';
if(s.answer)out+=`<p class="answer" data-reveal="${s.stages}" style="visibility:${k===s.stages?'visible':'hidden'}"><b>Explanation.</b> ${e(s.answer)}</p>`;
if(s.aside)out+=`<p class="aside">${e(s.aside)}</p>`;return out}
function source(s){return s.sources.map(key=>`<a href="${e(D.sources[key][1])}">${e(D.sources[key][0])}</a>`).join(' · ')}
function slide(s,k,i,total){return `<section class="slide ${s.kind} ${s.id}" data-id="${s.id}" data-stage="${k}" data-stages="${s.stages}"><header><span class="public-brand">Emory University · Oxford College</span><span>ECON_OX 112 · Chapter 15</span></header><h1>${e(s.title)}</h1><div class="body">${body(s,k)}</div><div class="sources">${source(s)}</div><footer><span>Monetary Policy${s.graph==='countries'?' · OECD data terms apply':''}</span><span>${i+1} / ${total} · ${k} / ${s.stages}</span></footer></section>`}
 function render(){document.getElementById('viewport').innerHTML=slide(slides[current],stage,current,slides.length);document.getElementById('position').textContent=(current+1)+' / '+slides.length+' · Step '+stage+' / '+slides[current].stages;history.replaceState(null,'','#'+(current+1)+'/'+stage);scale()}
 function go(i,k=1){current=Math.max(0,Math.min(i,slides.length-1));stage=Math.max(1,Math.min(k,slides[current].stages));render()}
 function next(){if(stage<slides[current].stages)stage++;else if(current<slides.length-1){current++;stage=1}render()}
 function back(){if(stage>1)stage--;else if(current>0){current--;stage=slides[current].stages}render()}
 function restart(){stage=1;render()}
 function scale(){let v=document.getElementById('viewport'),s=v.querySelector('.slide'),z=Math.min(innerWidth/1280,(innerHeight-58)/720);s.style.transform='scale('+z+')';v.style.width=1280*z+'px';v.style.height=720*z+'px'}
 document.getElementById('next').onclick=next;document.getElementById('back').onclick=back;document.getElementById('restart').onclick=restart;
 addEventListener('keydown',ev=>{if(/^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/.test(ev.target.tagName))return;if(['ArrowRight',' ','PageDown'].includes(ev.key)){ev.preventDefault();next()}else if(['ArrowLeft','PageUp'].includes(ev.key)){ev.preventDefault();back()}else if(ev.key.toLowerCase()==='r')restart()});addEventListener('resize',scale);const h=location.hash.slice(1).split('/').map(Number);go((h[0]||1)-1,h[1]||1);window.courseDeck={go,next,back,restart,slides,getState:()=>({current,stage})};</script></body></html>
